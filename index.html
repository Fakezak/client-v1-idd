<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaka Project - Free Fire Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        #loading {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        #welcome-message, #enjoy-message {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .main-text {
            color: #ff0000;
        }

        .emoji {
            color: #00ff00;
        }

        #enjoy-message {
            font-size: 3rem;
        }

        #authenticated-state {
            text-align: left;
            animation: fadeIn 1s ease-in;
        }

        .success-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .token-display {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .error-message {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 20px;
            text-align: center;
            border: 1px solid #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Connecting to Zaka servers...</p>
        </div>

        <div id="welcome-message" class="hidden">
            <span class="main-text" id="welcome-text"></span>
            <span class="emoji">:)</span>
        </div>

        <div id="enjoy-message" class="hidden">
            <span class="main-text">Enjoy</span>
            <span class="emoji">:)</span>
        </div>

        <div id="authenticated-state" class="hidden">
            <span class="success-badge">✓ Authenticated</span>
            <h2>Zaka Project</h2>
            <div class="user-info">
                <div class="info-item">
                    <strong>Account ID:</strong><br>
                    <span id="account-id"></span>
                </div>
                <div class="info-item">
                    <strong>Request ID:</strong><br>
                    <span id="request-id"></span>
                </div>
                <div class="info-item">
                    <strong>Session Expires:</strong><br>
                    <span id="session-expiry"></span>
                </div>
                <div class="token-display">
                    <strong>Session Token:</strong><br>
                    <span id="session-token"></span>
                </div>
            </div>
        </div>

        <div id="error-container" class="error-message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
